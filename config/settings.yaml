# Global, non-channel-specific settings. Channel profiles (config/channels/*.yaml)
# pick a provider by name; connection details for that provider live here so
# no provider is ever hardcoded in code.

llm:
  ollama:
    base_url: "http://localhost:11434"
    default_model: "llama3.1:8b"
  openrouter:
    base_url: "https://openrouter.ai/api/v1"
    api_key_env: "OPENROUTER_API_KEY"
    default_model: "anthropic/claude-opus-5"

# OAuth client for the YouTube Data API v3. client_secrets_path points at a
# JSON file you download from Google Cloud Console (OAuth client ID, type
# "Desktop app") -- it's gitignored, you must provide your own. One OAuth
# app/client is shared across channels; each channel gets its own cached
# token (from its own one-time consent flow) at .youtube_tokens/<channel>.json.
youtube:
  client_secrets_path: "config/youtube_client_secret.json"
  scopes:
    - "https://www.googleapis.com/auth/youtube"

paths:
  output_dir: "output"

transcribe:
  model_size: "large-v3"
  device: "auto"
  compute_type: "auto"
